[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpi-monitor"
version = "0.1.0"
description = "HPC job sidecar: sample MPI/task process CPU, memory, and IO timeseries"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
mpi-monitor = "mpi_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
